services:
  db:
    image: postgres:16-alpine
    container_name: paylink-db
    environment:
      POSTGRES_USER: paylink
      POSTGRES_PASSWORD: paylink_dev_password
      POSTGRES_DB: paylink_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylink -d paylink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: paylink-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://paylink:paylink_dev_password@db:5432/paylink_db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3